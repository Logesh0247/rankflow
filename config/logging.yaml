# RANKFLOW AI — logging configuration (reference; code default is in
# app/core/logging.py, which uses this format and LOG_LEVEL).
version: 1
disable_existing_loggers: false
formatters:
  default:
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout
root:
  level: INFO
  handlers: [console]
loggers:
  rankflow:
    level: INFO
    handlers: [console]
    propagate: false
