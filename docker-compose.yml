# RANKFLOW AI — local / single-host deployment (Prompt 12, Phase 6).
# One service: the API serves the backend AND the UI at /ui/.
# SQLite is the default (data/ volume); uncomment the db service and
# DATABASE_URL for PostgreSQL. No Redis is required — jobs run
# in-process and synchronously.
services:
  api:
    build: .
    image: rankflow-ai:latest
    container_name: rankflow-ai
    env_file:
      - .env
    environment:
      # Single-host defaults; override in .env when needed.
      APP_ENV: production
      DATABASE_URL: sqlite:////app/data/rankflow.db
      STORAGE_ROOT: /app/data/storage
      RATE_LIMIT_PER_MINUTE: "120"
    ports:
      # Bind to localhost only by default. Expose publicly only
      # behind a reverse proxy with authentication (see
      # docs/DEPLOYMENT.md — this service has no login of its own).
      - "127.0.0.1:8000:8000"
    volumes:
      # Database, renders and backups must survive restarts.
      - rankflow-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # PostgreSQL (optional — uncomment to use it instead of SQLite):
  # db:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: rankflow
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  #     POSTGRES_DB: rankflow
  #   volumes:
  #     - rankflow-pgdata:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  rankflow-data:
  # rankflow-pgdata:
